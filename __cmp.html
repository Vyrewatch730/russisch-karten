<!doctype html><meta charset="utf-8"><pre id="out"></pre><iframe id="a" src="index.html" hidden></iframe>
<script>
document.getElementById('a').onload = async e => {
  const w = e.target.contentWindow, out = [];
  const probe = await (await fetch('__probe.json')).json();
  const deck = await (await fetch('decks/nomen-01.json', { cache: 'no-cache' })).json();
  for (const p of probe.cards) {
    const c = deck.cards.find(c => c.id === p.id);
    if (!c) { out.push('fehlt: ' + p.id); continue; }
    const { sg, pl } = w.nounDecl(Object.assign({}, c), c.ru);
    const ps = (p.sg || '').split('|').filter(Boolean), pp = (p.pl || '').split('|').filter(Boolean);
    if (ps.length && ps.join('|') !== sg.join('|')) out.push(`${p.ru} SG\n  alt: ${ps.join(' ')}\n  neu: ${sg.join(' ')}`);
    if (pp.length && pp.join('|') !== pl.join('|')) out.push(`${p.ru} PL\n  alt: ${pp.join(' ')}\n  neu: ${pl.join(' ')}`);
  }
  document.getElementById('out').textContent = 'Vergleich fertig\n' + out.join('\n');
};
</script>
