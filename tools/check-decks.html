<!doctype html>
<meta charset="utf-8">
<title>Deck-Prüfung</title>
<!-- Prüft die Verb-Decks: Betonung, Pflichtfelder, spanische Konjugation.
     Aufruf über den lokalen Server: http://localhost:8080/tools/check-decks.html?deck=verben-01 (ohne deck = alle) -->
<pre id="out">läuft …</pre>
<iframe id="app" src="../index.html" hidden></iframe>
<script>
const out = [];
document.getElementById('app').onload = async e => {
  const w = e.target.contentWindow;
  const only = new URLSearchParams(location.search).get('deck');
  const verbose = new URLSearchParams(location.search).has('verbose');
  const index = await (await fetch('../decks/index.json', { cache: 'no-cache' })).json();
  const RU_FIELDS = ['ipf', 'ipf_1', 'ipf_2', 'pf', 'pf_1', 'pf_2', 'example', 'ipf_imp_ex', 'pf_imp_ex'];
  const REQUIRED = ['de', 'en', 'es', 'example', 'example_de', 'example_en', 'example_es', 'example_cases', 'government'];
  let cards = 0, problems = 0;
  const problem = (c, msg) => { problems++; out.push(`✗ ${c.id} ${c.ru}: ${msg}`); };
  for (const entry of index.filter(d => d.id.startsWith('verben-') && (!only || d.id === only))) {
    const deck = await (await fetch('../decks/' + entry.file, { cache: 'no-cache' })).json();
    out.push(`== ${deck.name} (${deck.cards.length} Karten)`);
    for (const c of deck.cards) {
      cards++;
      for (const k of REQUIRED) if (!c[k]) problem(c, `Feld ${k} fehlt`);
      // Jedes in den Fällen genannte Wort muss genau so im Beispielsatz vorkommen
      if (c.example_cases && c.example) {
        const sentence = c.example.toLowerCase();
        for (const part of c.example_cases.split(' · ').filter(p => !p.startsWith('nur Nominativ'))) {
          const words = (part.split(' – ')[0].match(/[а-яё́-]+/gi) || []);
          for (const word of words) if (!sentence.includes(word.toLowerCase())) problem(c, `Fälle: „${word}“ steht nicht im Satz`);
        }
      }
      // Imperativ-Beispiel: Pflicht, sobald es einen Imperativ gibt; ты- oder вы-Form muss im Satz stehen
      for (const p of c.pf === c.ipf ? ['ipf'] : ['ipf', 'pf']) {
        if (!c[p]) continue;
        const imp = c[p + '_imp'] !== undefined ? c[p + '_imp'] : w.ruImperative(c[p], c[p + '_1'], c[p + '_2']);
        if (!imp || imp === '—') { if (c[p + '_imp_ex']) problem(c, `${p}: Beispiel ohne Imperativ`); continue; }
        const ex = (c[p + '_imp_ex'] || '').toLowerCase();
        if (!ex) { problem(c, `${p}: kein Imperativ-Beispiel (${imp})`); continue; }
        if (!c[p + '_imp_ex_de']) problem(c, `${p}: Imperativ-Beispiel ohne Übersetzung`);
        const forms = [imp, w.ruImperativePlural(imp)].map(f => f.toLowerCase());
        if (!forms.some(f => new RegExp(`(^|[^а-яё́])${f}([^а-яё́]|$)`).test(ex))) problem(c, `${p}: „${imp}“ steht nicht im Beispiel: ${c[p + '_imp_ex']}`);
        if (verbose) out.push(`   ${p} ${imp}: ${c[p + '_imp_ex']} — ${c[p + '_imp_ex_de']}`);
      }
      if (c.ipf && !c.ipf_1 && !c.ipf_2) problem(c, 'ipf ohne я/ты-Formen');
      if (c.pf && c.pf !== c.ipf && !c.pf_1 && !c.pf_2) problem(c, 'pf ohne я/ты-Formen');
      for (const k of RU_FIELDS) {
        for (const word of (c[k] || '').match(/[а-яёА-ЯЁ́]+/g) || []) {
          const vowels = (word.match(/[аеёиоуыэюяАЕЁИОУЫЭЮЯ]/g) || []).length;
          const marks = (word.match(/́/g) || []).length + (word.match(/[ёЁ]/g) || []).length;
          if (/[a-z]/i.test(word)) problem(c, `${k}: lateinischer Buchstabe in „${word}“`);
          if (vowels > 1 && marks !== 1) problem(c, `${k}: „${word}“ hat ${marks} Betonungen`);
          if (vowels === 1 && /́/.test(word)) problem(c, `${k}: einsilbiges „${word}“ mit Akzent`);
          if (/ё́/.test(word)) problem(c, `${k}: ё mit Akzent`);
        }
      }
      const verbs = [c.es_verb || w.esMainVerb(c.es), c.es2_verb].filter(Boolean);
      for (const v of verbs) {
        const r = w.esConjugate(v);
        if (!r) problem(c, `Spanisch „${v}“ nicht konjugierbar`);
        else if (verbose) out.push(`   ${v}: ${r.pres.join(', ')} | ${r.past.join(', ')}`);
      }
      if (verbose) out.push(`   ${c.ipf || ''} [${w.ruPron(c.ipf)}] ${c.ipf_1 || ''} [${w.ruPron(c.ipf_1)}] · ${c.pf || ''} [${w.ruPron(c.pf)}] ${c.pf_1 || ''} [${w.ruPron(c.pf_1)}] · ${w.ruPron(c.example)}`);
    }
  }

  // Nomen: Pflichtfelder, Betonung, Fälle im Satz und alle 12 berechneten Formen
  const stressProblems = (text) => {
    const res = [];
    for (const word of (text || '').match(/[а-яёА-ЯЁ́]+/g) || []) {
      const vowels = (word.match(/[аеёиоуыэюяАЕЁИОУЫЭЮЯ]/g) || []).length;
      const marks = (word.match(/́/g) || []).length + (word.match(/[ёЁ]/g) || []).length;
      if (vowels > 1 && marks !== 1) res.push(`„${word}“ hat ${marks} Betonungen`);
      if (vowels === 1 && /́/.test(word)) res.push(`einsilbiges „${word}“ mit Akzent`);
    }
    return res;
  };
  const NOUN_REQUIRED = ['de', 'en', 'es', 'example', 'example_de', 'example_en', 'example_es', 'example_cases'];
  for (const entry of index.filter(d => d.id.startsWith('nomen-') && (!only || d.id === only))) {
    const deck = await (await fetch('../decks/' + entry.file, { cache: 'no-cache' })).json();
    out.push(`== ${deck.name} (${deck.cards.length} Karten)`);
    for (const c of deck.cards) {
      cards++;
      for (const k of NOUN_REQUIRED) if (!c[k]) problem(c, `Feld ${k} fehlt`);
      if (!['m', 'f', 'n', 'pl'].includes(c.gender)) problem(c, `Geschlecht „${c.gender}“ unbekannt`);
      const sentence = (c.example || '').toLowerCase();
      for (const part of (c.example_cases || '').split(' · ')) {
        for (const word of part.split(' – ')[0].match(/[а-яё́-]+/gi) || []) if (!sentence.includes(word.toLowerCase())) problem(c, `Fälle: „${word}“ steht nicht im Satz`);
      }
      for (const k of ['ru', 'example', 'gen', 'npl', 'gpl', 'dpl', 'akk', 'ins', 'ipl', 'loc']) for (const p of stressProblems(c[k])) problem(c, `${k}: ${p}`);
      const x = Object.assign({}, c);
      const { sg, pl } = w.nounDecl(x, c.ru);
      if (!c.indecl) {
        if (c.gender !== 'pl' && (sg.length !== 6 || sg.some(f => !f))) problem(c, `Singular unvollständig: ${sg.join(', ')}`);
        if (pl.length && pl.some(f => !f)) problem(c, `Plural unvollständig: ${pl.join(', ')}`);
        if (c.gender === 'pl' && pl.length !== 6) problem(c, 'nur Plural, aber keine Pluralformen');
      }
      for (const f of sg.concat(pl)) for (const p of stressProblems(f)) problem(c, `Form: ${p}`);
      if (verbose) out.push(`   ${c.ru} (${c.gender}${c.anim ? ', belebt' : ''}): ${sg.join(' ')} | ${pl.join(' ')}`);
    }
  }
  // Adjektive: Pflichtfelder, Betonung, Fälle im Satz, alle 24 berechneten Formen
  const ADJ_REQUIRED = ['de', 'en', 'es', 'example', 'example_de', 'example_en', 'example_es', 'example_cases'];
  for (const entry of index.filter(d => d.id.startsWith('adjektive-') && (!only || d.id === only))) {
    const deck = await (await fetch('../decks/' + entry.file, { cache: 'no-cache' })).json();
    out.push(`== ${deck.name} (${deck.cards.length} Karten)`);
    for (const c of deck.cards) {
      cards++;
      for (const k of ADJ_REQUIRED) if (!c[k]) problem(c, `Feld ${k} fehlt`);
      if (!/(ый|ий|о́й)$/.test(c.ru)) problem(c, 'Grundform endet nicht auf -ый/-ий/-о́й');
      const sentence = (c.example || '').toLowerCase();
      for (const part of (c.example_cases || '').split(' · ')) {
        for (const word of part.split(' – ')[0].match(/[а-яё́-]+/gi) || []) if (!sentence.includes(word.toLowerCase())) problem(c, `Fälle: „${word}“ steht nicht im Satz`);
      }
      for (const k of ['ru', 'example', 'short', 'comp', 'anto']) for (const p of stressProblems(c[k])) problem(c, `${k}: ${p}`);
      const d = w.adjDecl(c.ru);
      const forms = ['m', 'n', 'f', 'pl'].flatMap(g => d[g].flatMap(f => f.split(' / ')));
      for (const f of forms) for (const p of stressProblems(f)) problem(c, `Form: ${p}`);
      if (verbose) out.push(`   ${c.ru}: ${d.m.join(' ')} | ${d.f.join(' ')} | ${d.pl[0]}`);
    }
  }
  out.unshift(`${cards} Karten geprüft, ${problems} Probleme`);
  document.getElementById('out').textContent = out.join('\n');
};
</script>
